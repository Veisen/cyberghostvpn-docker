name: Auto-Build CyberGhost

on:
  schedule:
    - cron: '0 */6 * * *' # Kontrola každých 6 hodin
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Tato proměnná teď bude mít právo zápisu

      - name: Get Version URL
        id: get_ver
        run: |
          # Pokud parsování selže, použijeme 1.3.4 jako základ
          DEFAULT_VER="1.3.4"
          
          # Zkusíme získat URL s lepším User-Agentem, aby nás CyberGhost neblokoval
          URL=$(curl -sL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" https://www.cyberghostvpn.com/en_US/vpn-for-linux | grep -oE 'https://download.cyberghostvpn.com/linux/cyberghostvpn-ubuntu-[0-9.]+-1[a-zA-Z0-9.-]*\.zip' | head -n 1)
          
          if [ -z "$URL" ]; then
            echo "Web nás zablokoval nebo změnil strukturu. Používám default verzi $DEFAULT_VER"
            URL="https://download.cyberghostvpn.com/linux/cyberghostvpn-ubuntu-22.04-${DEFAULT_VER}.zip"
          fi
          
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "hash=${{ hashFiles('Dockerfile', 'entrypoint.sh') }}-$URL" >> $GITHUB_OUTPUT

      - name: Cache Check
        id: cache
        uses: actions/cache@v3
        with:
          path: version.txt
          key: ${{ steps.get_ver.outputs.hash }}

      - name: Build and Push
        if: steps.cache.outputs.cache-hit != 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/veisen/cyberghostvpn-docker/cyberghost-proxy:latest
          build-args: DOWNLOAD_URL=${{ steps.get_ver.outputs.url }}
          
      - name: Update Cache Tag
        if: steps.cache.outputs.cache-hit != 'true'
        run: echo ${{ steps.get_ver.outputs.url }} > version.txt
